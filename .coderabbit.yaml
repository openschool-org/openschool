# CodeRabbit configuration for OpenSchool.
# Reference: https://docs.coderabbit.ai/reference/yaml-template

language: "en-US"

tone_instructions: >
  Be concise and direct. This is a Go (Gin/sqlc) + React (Vite/TypeScript/Carbon)
  monorepo for a self-hosted school management system. Prioritize correctness,
  security, and data-integrity issues over style nitpicks — gofmt, staticcheck,
  eslint, and tsc already run in CI, so skip anything those would already catch.

early_access: false

reviews:
  profile: "chill"
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  request_changes_workflow: false
  abort_on_close: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  path_filters:
    - "!backend/db/sqlc/**"
    - "!frontend/pnpm-lock.yaml"
    - "!backend/go.sum"
    - "!frontend/dist/**"
    - "!**/*.min.js"

  path_instructions:
    - path: "backend/db/sqlc/**"
      instructions: >
        Generated by sqlc from backend/db/queries/ and backend/db/migrations/ —
        never suggest hand-editing this code. If something looks wrong here, the
        real fix belongs in the source .sql query or migration instead.

    - path: "backend/db/migrations/**"
      instructions: >
        golang-migrate numbered up/down pairs. Check that every "up" migration has
        a corresponding reversible "down", that new tables holding academic data
        carry an academic_year_id FK, and that destructive changes (DROP/TRUNCATE/
        column removal) are called out explicitly rather than glossed over.

    - path: "backend/internal/routes/**"
      instructions: >
        Every route touching non-public data must go through AuthMiddleware and,
        where role-specific, RequireRole — flag any new route that looks reachable
        without one.

    - path: "backend/internal/identity/**"
      instructions: >
        Provider-neutral seam for ThunderID. Hand-typed attribute/role-name strings
        here fail silently at runtime rather than at build/test time if they drift
        from the out-of-repo ThunderID console config (root cause of two prior
        production incidents) — flag any new hardcoded attribute/role string that
        bypasses the existing RoleID()/JWKSURL()/Issuer() helpers.

    - path: "backend/internal/thunderid/**"
      instructions: >
        Concrete ThunderID client implementing identity.Provider. Same caution as
        internal/identity/ around hand-typed attribute names.

    - path: "frontend/src/pages/**"
      instructions: >
        Admin pages follow a list + modal-form + confirm-delete template built on
        src/components/common/ (ConfirmDeleteModal, EntityCombobox, EmptyState,
        FormModal, Avatar, StatusTag, etc.) — flag a page that reimplements one of
        these instead of reusing it, and note when a page has grown large enough
        to warrant its own local components/ folder.

    - path: "frontend/src/queries/**"
      instructions: >
        TanStack Query hooks. Mutations must invalidate every query key they
        affect — flag a mutation with no invalidateQueries/setQueryData follow-up.

    - path: "frontend/src/services/**"
      instructions: >
        Thin axios wrappers that must match backend/internal/models/ shapes —
        flag a service function whose payload/response shape has drifted from the
        corresponding Go model or route.

knowledge_base:
  code_guidelines:
    filePatterns:
      - "docs/ARCHITECTURE.md"
      - "docs/FEATURES.md"
      - "docs/adr/**"
      - "audit.md"
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  pull_requests:
    scope: "auto"

chat:
  auto_reply: true
