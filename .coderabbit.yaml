# CodeRabbit configuration for OpenSchool.
# Reference: https://docs.coderabbit.ai/reference/yaml-template
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"

tone_instructions: >
  Be direct — this is assertive-profile deep review. Surface every correctness,
  security, concurrency, and data-integrity issue found, however minor. Skip
  pure style: gofmt/staticcheck/eslint/tsc already enforce that in CI.

early_access: false

reviews:
  profile: "assertive"
  high_level_summary: true
  poem: false
  review_status: true
  review_details: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  sequence_diagrams: true
  changed_files_summary: true
  collapse_walkthrough: true
  request_changes_workflow: false
  abort_on_close: true
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # "main" is already covered as the repo's default branch; this repo's
    # flow is feature -> development -> main, so add development explicitly.
    base_branches:
      - "development"

  finishing_touches:
    simplify:
      enabled: true
    unit_tests:
      enabled: true

  tools:
    golangci-lint:
      enabled: true
    eslint:
      enabled: true
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    sqlfluff:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    semgrep:
      enabled: true

  path_filters:
    - "!backend/db/sqlc/**"
    - "!frontend/pnpm-lock.yaml"
    - "!backend/go.sum"
    - "!frontend/dist/**"
    - "!**/*.min.js"

  path_instructions:
    - path: "backend/db/sqlc/**"
      instructions: >
        Generated by sqlc from backend/db/queries/ and backend/db/migrations/ —
        never suggest hand-editing this code. If something looks wrong here, the
        real fix belongs in the source .sql query or migration instead.

    - path: "backend/db/migrations/**"
      instructions: >
        golang-migrate numbered up/down pairs. Check that every "up" migration has
        a corresponding reversible "down", that new tables holding academic data
        carry an academic_year_id FK, and that destructive changes (DROP/TRUNCATE/
        column removal) are called out explicitly rather than glossed over.

    - path: "backend/internal/routes/**"
      instructions: >
        Every route touching non-public data must go through AuthMiddleware and,
        where role-specific, RequireRole — flag any new route that looks reachable
        without one.

    - path: "backend/internal/identity/**"
      instructions: >
        Provider-neutral seam for ThunderID. Hand-typed attribute/role-name strings
        here fail silently at runtime rather than at build/test time if they drift
        from the out-of-repo ThunderID console config (root cause of two prior
        production incidents) — flag any new hardcoded attribute/role string that
        bypasses the existing RoleID()/JWKSURL()/Issuer() helpers.

    - path: "backend/internal/thunderid/**"
      instructions: >
        Concrete ThunderID client implementing identity.Provider. Same caution as
        internal/identity/ around hand-typed attribute names.

    - path: "frontend/src/pages/**"
      instructions: >
        Admin pages follow a list + modal-form + confirm-delete template built on
        src/components/common/ (ConfirmDeleteModal, EntityCombobox, EmptyState,
        FormModal, Avatar, StatusTag, etc.) — flag a page that reimplements one of
        these instead of reusing it, and note when a page has grown large enough
        to warrant its own local components/ folder.

    - path: "frontend/src/queries/**"
      instructions: >
        TanStack Query hooks. Mutations must invalidate every query key they
        affect — flag a mutation with no invalidateQueries/setQueryData follow-up.

    - path: "frontend/src/services/**"
      instructions: >
        Thin axios wrappers that must match backend/internal/models/ shapes —
        flag a service function whose payload/response shape has drifted from the
        corresponding Go model or route.

    - path: "backend/db/queries/**"
      instructions: >
        Raw SQL annotated for sqlc. On tables scoped by academic_year_id, flag
        any SELECT/UPDATE/DELETE missing that filter unless the query is
        deliberately cross-year (e.g. promotion, portfolio history). Flag
        queries issued in a loop from Go call sites (N+1) and any JOIN/WHERE/
        ORDER BY that looks unindexed given backend/db/migrations/.

    - path: "backend/internal/services/**"
      instructions: >
        Business-logic layer. DB access must go through internal/repositories/,
        not raw pgx/sqlc calls inlined here — flag any that bypass the
        repository layer. Also flag business rules duplicated across services
        instead of shared.

    - path: "backend/internal/repositories/**"
      instructions: >
        Data-access layer only — flag any HTTP-specific concern (gin.Context,
        status codes, request/response shaping) leaking in here; that belongs
        in internal/routes/.

    - path: "frontend/src/components/common/**"
      instructions: >
        Shared CRUD building blocks (ConfirmDeleteModal, EntityCombobox,
        EmptyState, FormModal, Avatar, StatusTag) that most admin pages compose
        from. Review changes here for effects on every consumer, not just the
        page that motivated the change.

knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    filePatterns:
      - "docs/ARCHITECTURE.md"
      - "docs/FEATURES.md"
      - "docs/adr/**"
      - "audit.md"
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  pull_requests:
    scope: "auto"

chat:
  auto_reply: true
