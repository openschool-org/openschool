# File: Console_App_Authentication_Flow.yaml
resource_type: flow
id: 01900000-0000-7000-8000-000000000068
handle: console-app-flow
name: Console App Authentication Flow
flowType: AUTHENTICATION
activeVersion: 1
nodes:
  - id: start
    type: START
    onSuccess: sso_check
  - id: sso_check
    type: TASK_EXECUTION
    properties:
      checkpointRef: "session"
    executor:
      name: SSOCheckExecutor
    onSuccess: session
    onFailure: prompt_credentials
  - id: prompt_credentials
    type: PROMPT
    meta: '{"components":[{"id":"text_001","label":"{{ t(signin:forms.credentials.title) }}","type":"TEXT","variant":"HEADING_1"},{"components":[{"id":"input_001","label":"{{ t(signin:forms.credentials.fields.username.label) }}","placeholder":"{{ t(signin:forms.credentials.fields.username.placeholder) }}","ref":"username","required":true,"type":"TEXT_INPUT"},{"id":"input_002","label":"{{ t(signin:forms.credentials.fields.password.label) }}","placeholder":"{{ t(signin:forms.credentials.fields.password.placeholder) }}","ref":"password","required":true,"type":"PASSWORD_INPUT"},{"action":{"ref":"action_forgot_password"},"category":"DISPLAY","id":"rich_text_forgot_password","label":"\u003cp data-component-ref=\"recovery-link\" class=\"rich-text-paragraph\"\u003e\u003cspan class=\"rich-text-pre-wrap\"\u003e{{ t(signin:forms.credentials.links.forgot_password.prefix) }} \u003c/span\u003e\u003ca href=\"#\" data-action-ref=\"action_forgot_password\" class=\"rich-text-link\"\u003e\u003cspan class=\"rich-text-pre-wrap\"\u003e{{ t(signin:forms.credentials.links.forgot_password.label) }}\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e","resourceType":"ELEMENT","type":"RICH_TEXT"},{"eventType":"SUBMIT","id":"action_001","label":"{{ t(signin:forms.credentials.actions.submit.label) }}","type":"ACTION","variant":"PRIMARY"}],"id":"block_001","type":"BLOCK"},{"action":{"ref":"action_signup"},"category":"DISPLAY","id":"rich_text_signup","label":"\u003cp data-component-ref=\"self-sign-up-link\" class=\"rich-text-paragraph\"\u003e\u003cspan class=\"rich-text-pre-wrap\"\u003e{{ t(signin:forms.credentials.links.sign_up.prefix) }} \u003c/span\u003e\u003ca href=\"#\" data-action-ref=\"action_signup\" class=\"rich-text-link\"\u003e\u003cspan class=\"rich-text-pre-wrap\"\u003e{{ t(signin:forms.credentials.links.sign_up.label) }}\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e","resourceType":"ELEMENT","type":"RICH_TEXT"}]}'
    prompts:
      - inputs:
          - ref: input_001
            type: TEXT_INPUT
            identifier: username
            required: true
          - ref: input_002
            type: PASSWORD_INPUT
            identifier: password
            required: true
        action:
          ref: action_001
          nextNode: credentials_auth
      - action:
          ref: action_forgot_password
          nextNode: call_recovery
      - action:
          ref: action_signup
          nextNode: call_registration
  - id: credentials_auth
    type: TASK_EXECUTION
    executor:
      name: CredentialsAuthExecutor
    onSuccess: session
    onIncomplete: prompt_credentials
  - id: session
    type: TASK_EXECUTION
    executor:
      name: SessionExecutor
    onSuccess: authorization_check
  - id: authorization_check
    type: TASK_EXECUTION
    executor:
      name: AuthorizationExecutor
    onSuccess: auth_assert
  - id: auth_assert
    type: TASK_EXECUTION
    executor:
      name: AuthAssertExecutor
    onSuccess: end
  - id: call_recovery
    type: CALL
    onSuccess: end
    flow:
      ref: 01900000-0000-7000-8000-000000000070
  - id: call_registration
    type: CALL
    onSuccess: authorization_check
    flow:
      ref: 01900000-0000-7000-8000-000000000069
  - id: end
    type: END
