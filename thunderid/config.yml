# File: Console_App_Recovery_Flow.yaml
resource_type: flow
id: 01900000-0000-7000-8000-000000000070
handle: console-app-flow
name: Console App Recovery Flow
flowType: RECOVERY
activeVersion: 1
nodes:
  - id: start
    type: START
    onSuccess: prompt_username
  - id: prompt_username
    type: PROMPT
    meta: '{"components":[{"align":"center","id":"text_header_username","label":"{{ t(recovery:forms.username.title) }}","type":"TEXT","variant":"HEADING_1"},{"id":"text_subtitle_username","label":"{{ t(recovery:forms.username.subtitle) }}","type":"TEXT","variant":"HEADING_6"},{"components":[{"id":"input_username","label":"{{ t(recovery:forms.username.fields.username.label) }}","placeholder":"{{ t(recovery:forms.username.fields.username.placeholder) }}","ref":"username","required":true,"type":"TEXT_INPUT"},{"eventType":"SUBMIT","id":"action_submit_username","label":"{{ t(recovery:forms.username.actions.submit.label) }}","type":"ACTION","variant":"PRIMARY"}],"id":"block_username","type":"BLOCK"},{"action":{"ref":"action_signin"},"category":"DISPLAY","id":"rich_text_signin","label":"\u003cp data-component-ref=\"sign-in-link\" class=\"rich-text-paragraph\"\u003e\u003cspan class=\"rich-text-pre-wrap\"\u003e{{ t(recovery:forms.username.links.sign_in.prefix) }} \u003c/span\u003e\u003ca href=\"#\" data-action-ref=\"action_signin\" class=\"rich-text-link\"\u003e\u003cspan class=\"rich-text-pre-wrap\"\u003e{{ t(recovery:forms.username.links.sign_in.label) }}\u003c/span\u003e\u003c/a\u003e\u003c/p\u003e","resourceType":"ELEMENT","type":"RICH_TEXT"}]}'
    prompts:
      - inputs:
          - ref: input_username
            type: TEXT_INPUT
            identifier: username
            required: true
        action:
          ref: action_submit_username
          nextNode: identify_user
      - action:
          ref: action_signin
          nextNode: call_authentication
  - id: identify_user
    type: TASK_EXECUTION
    executor:
      name: IdentifyingExecutor
      mode: identify
      inputs:
        - ref: input_username
          type: TEXT_INPUT
          identifier: username
          required: true
    onSuccess: generate_recovery_token
    onFailure: email_sent_status
  - id: generate_recovery_token
    type: TASK_EXECUTION
    executor:
      name: InviteExecutor
      mode: generate
    onSuccess: send_recovery_email
  - id: send_recovery_email
    type: TASK_EXECUTION
    properties:
      emailTemplate: "PASSWORD_RECOVERY"
    executor:
      name: EmailExecutor
      mode: send
      inputs:
        - type: EMAIL_INPUT
          identifier: email
          required: true
    onSuccess: email_sent_status
    onFailure: email_sent_status
  - id: email_sent_status
    type: PROMPT
    meta: '{"components":[{"align":"center","id":"email_sent_icon","label":"✉️","type":"TEXT","variant":"HEADING_1"},{"align":"center","id":"email_sent_heading","label":"{{ t(recovery:forms.email_sent.title) }}","type":"TEXT","variant":"HEADING_1"},{"align":"center","id":"email_sent_message","label":"{{ t(recovery:forms.email_sent.message) }}","type":"TEXT","variant":"HEADING_6"}]}'
    next: verify_recovery_token
    message: Check Your Email
  - id: verify_recovery_token
    type: TASK_EXECUTION
    executor:
      name: InviteExecutor
      mode: verify
      inputs:
        - ref: input_recovery_token
          type: HIDDEN
          identifier: inviteToken
          required: true
    onSuccess: prompt_new_password
  - id: prompt_new_password
    type: PROMPT
    meta: '{"components":[{"align":"center","id":"text_header_password","label":"{{ t(recovery:forms.new_password.title) }}","type":"TEXT","variant":"HEADING_1"},{"id":"text_subtitle_password","label":"{{ t(recovery:forms.new_password.subtitle) }}","type":"TEXT","variant":"HEADING_6"},{"components":[{"id":"input_new_password","label":"{{ t(recovery:forms.new_password.fields.password.label) }}","placeholder":"{{ t(recovery:forms.new_password.fields.password.placeholder) }}","ref":"password","required":true,"type":"PASSWORD_INPUT"},{"eventType":"SUBMIT","id":"action_submit_password","label":"{{ t(recovery:forms.new_password.actions.submit.label) }}","type":"ACTION","variant":"PRIMARY"}],"id":"block_password","type":"BLOCK"}]}'
    prompts:
      - inputs:
          - ref: input_new_password
            type: PASSWORD_INPUT
            identifier: password
            required: true
        action:
          ref: action_submit_password
          nextNode: set_credential
  - id: set_credential
    type: TASK_EXECUTION
    executor:
      name: CredentialSetter
    onSuccess: recovery_complete
  - id: recovery_complete
    type: PROMPT
    meta: '{"components":[{"align":"center","id":"recovery_complete_icon","label":"✅","type":"TEXT","variant":"HEADING_1"},{"align":"center","id":"recovery_complete_heading","label":"{{ t(recovery:forms.complete.title) }}","type":"TEXT","variant":"HEADING_1"},{"align":"center","id":"recovery_complete_message","label":"{{ t(recovery:forms.complete.message) }}","type":"TEXT","variant":"HEADING_6"}]}'
    next: end
    message: Password Reset Successful
  - id: call_authentication
    type: CALL
    onSuccess: end
    flow:
      ref: 01900000-0000-7000-8000-000000000068
  - id: end
    type: END
