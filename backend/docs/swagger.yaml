host: localhost:8080
info:
  contact: {}
  description: Digital Infrastructure for Sri Lankan Schools
  title: OpenSchool API
  version: "1.0"
paths:
  /academic-years:
    get:
      description: Retrieve all academic years ordered by start date
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AcademicYearResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List academic years
      tags:
      - academic-years
    post:
      consumes:
      - application/json
      description: Create a new academic year
      parameters:
      - description: Academic year info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateAcademicYearRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AcademicYearResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create academic year
      tags:
      - academic-years
  /academic-years/{academic_year_id}/classes:
    get:
      description: Get all classes for a specific academic year
      parameters:
      - description: Academic Year ID
        in: path
        name: academic_year_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ClassWithDetailsResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List classes by academic year
      tags:
      - classes
  /academic-years/{id}:
    delete:
      description: Delete an academic year by ID
      parameters:
      - description: Academic year UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete academic year
      tags:
      - academic-years
  /academic-years/{id}/set-current:
    put:
      description: Mark an academic year as the current one; clears the previous current
      parameters:
      - description: Academic year UUID
        in: path
        name: id
        required: true
        type: string
      produces:
