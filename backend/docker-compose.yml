services:
  postgres:
    image: postgres:17
    container_name: openschool-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-openschool}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Loopback only: Docker port publishing bypasses ufw, and the API runs on this host (V3).
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-openschool}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  
