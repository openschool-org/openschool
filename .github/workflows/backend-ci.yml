name: Backend CI

on:
  push:
    branches: [main, development]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches: [main, development]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

# Read-only token: this workflow only builds and tests.
# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -tags=integration ./...

      - name: Test
        run: go test ./...

      - name: Database integration tests
        # Every package, so leave, workflows and activation (the riskiest flows,
        # with the security regression tests) are no longer skipped (E9).
        run: go test -count=1 -tags=integration ./...

      - name: Vulnerability scan (govulncheck)
        # Blocking (S14): the prior findings were Go-toolchain-version CVEs,
        # cleared by pinning `toolchain` in go.mod past the fixed patch and
        # bumping the affected modules (golang.org/x/net, quic-go).
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Dead code scan
        # Informational: the SubjectChoices workflow is built but never
        # registered, so it and its store helpers show as unreachable. Make
        # this blocking once that is wired up or removed.
        run: go run golang.org/x/tools/cmd/deadcode@v0.48.0 ./...
        continue-on-error: true
