name: Frontend CI

on:
  push:
    branches: [main, development]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

  pull_request:
    branches: [main, development]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

# Read-only token: this workflow only lints, tests and builds.
# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        # No version here: the action reads "packageManager" from package.json,
        # so CI always uses the same pnpm as developers.
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Bundle size budget
        # Informational: CSS is ~123 KB (budget 400 KB) since Carbon was
        # removed, but the app entry chunk is ~464 KB against a 100 KB budget.
        # Make this blocking once the entry chunk is split down.
        run: node scripts/check-bundle-size.mjs --warn-only

      - name: Dependency audit
        # Blocking. dompurify is pinned via pnpm-workspace.yaml overrides until @thunderid/react updates.
        run: pnpm audit --prod
